<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klink – AI for Cars & Technology</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      font-weight: 600;
      font-size: 1.15rem;
    }
    header span {
      color: #3b82f6;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .msg {
      max-width: 85%;
      padding: 0.85rem 1.1rem;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
    }
    .assistant {
      align-self: flex-start;
      background: #262626;
    }
    form {
      display: flex;
      gap: 0.5rem;
      padding: 1rem 1.5rem;
      background: #1a1a1a;
      border-top: 1px solid #333;
    }
    input {
      flex: 1;
      padding: 0.8rem 1rem;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111;
      color: white;
      font-size: 1rem;
    }
    button {
      padding: 0.8rem 1.3rem;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>Klink <span>– AI for Cars & Technology</span></header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask about cars or technology..." autocomplete="off" required />
    <button type="submit">Send</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    const messages = [];

    function addMessage(role, content) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = content;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // Welcome message
    addMessage("assistant", "Hey! I'm Klink. Ask me anything about cars or technology.");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      addMessage("user", text);
      messages.push({ role: "user", content: text });

      const btn = form.querySelector("button");
      btn.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
            // "X-API-KEY": "your-server-key"   ← uncomment later if needed
          },
          body: JSON.stringify({ messages }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");

        addMessage("assistant", data.reply);
        messages.push({ role: "assistant", content: data.reply });
      } catch (err) {
        addMessage("assistant", "Error: " + err.message);
      } finally {
        btn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
