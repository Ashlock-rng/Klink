<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klink – AI for Cars & Technology</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      font-weight: 600;
      font-size: 1.15rem;
    }
    header span { color: #3b82f6; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .msg {
      max-width: 85%;
      padding: 0.85rem 1.1rem;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
    }
    .assistant {
      align-self: flex-start;
      background: #262626;
    }
    .msg img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 8px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding: 1rem 1.5rem;
      background: #1a1a1a;
      border-top: 1px solid #333;
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.8rem 1rem;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111;
      color: white;
      font-size: 1rem;
    }
    button {
      padding: 0.8rem 1.3rem;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .file-btn {
      background: #333;
      padding: 0.8rem 1rem;
    }
    #preview {
      max-width: 120px;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <header>Klink <span>– AI for Cars & Technology</span></header>
  <div id="chat"></div>

  <form id="form">
    <img id="preview" />
    <div class="input-row">
      <input id="input" type="text" placeholder="Ask about cars or technology..." autocomplete="off" />
      <label class="file-btn">
        📷
        <input type="file" id="imageInput" accept="image/*" hidden />
      </label>
      <button type="submit">Send</button>
    </div>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");

    let selectedImage = null; // base64

    function addMessage(role, content, imageUrl = null) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = content;
      if (imageUrl) {
        const img = document.createElement("img");
        img.src = imageUrl;
        div.appendChild(img);
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    addMessage("assistant", "Hey! I'm Klink. You can send text or images. I can see and read them.");

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        selectedImage = e.target.result;
        preview.src = selectedImage;
        preview.style.display = "block";
      };
      reader.readAsDataURL(file);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text && !selectedImage) return;

      input.value = "";
      const btn = form.querySelector("button");
      btn.disabled = true;

      // Show user message
      addMessage("user", text || "(Image sent)", selectedImage);

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            image: selectedImage
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || data.details || "Request failed");

        addMessage("assistant", data.reply);
      } catch (err) {
        addMessage("assistant", "Error: " + err.message);
      } finally {
        btn.disabled = false;
        selectedImage = null;
        preview.style.display = "none";
        imageInput.value = "";
        input.focus();
      }
    });
  </script>
</body>
</html>
